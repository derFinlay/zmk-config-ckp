# BLE stability.
#
# Symptom this fixes: BlueZ reads the HID-over-GATT attributes (PNP_ID,
# HID Information, Report Reference) before the link is encrypted. The board
# answers ATT 0x0E "unlikely error", BlueZ tears down and retries every few
# seconds, and that reconnect storm eventually wedges the BLE stack. USB stays
# enumerated but no HID reports are sent, so the board looks dead over cable
# too and only a hardware reset recovers it.
#
# Requesting security as soon as the connection comes up means the host
# encrypts before it ever touches those attributes.
CONFIG_ZMK_BLE_EXPERIMENTAL_SEC=y

# More robust reconnect / connection-parameter handling.
CONFIG_ZMK_BLE_EXPERIMENTAL_CONN=y
